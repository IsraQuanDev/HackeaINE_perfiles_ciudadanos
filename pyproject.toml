[project]
name = "ine-perfiles-participacion"
version = "0.1.0"
description = "Segmentación territorial de perfiles ciudadanos de participación electoral 2009-2024 (Hackatón INE - Reto 1)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "eval_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
